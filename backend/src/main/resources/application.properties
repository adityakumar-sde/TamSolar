spring.config.import=optional:file:.env[.properties]

# =========================================================
# SERVER CONFIGURATION
# =========================================================
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${PORT:${SERVER_PORT:7811}}
server.forward-headers-strategy=native

# =========================================================
# MYSQL DATABASE CONFIGURATION — AIVEN / LOCAL
# =========================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:tamsolar}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&sslMode=REQUIRED

spring.datasource.username=${DB_USER:tamsolar}
spring.datasource.password=${DB_PASSWORD:root123}

spring.datasource.hikari.connection-timeout=10000

# =========================================================
# DATABASE INITIALIZATION
# =========================================================
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:schema.sql

# =========================================================
# EMAIL CONFIGURATION (Brevo Relay on Port 2525 - unblocked on Render)
# =========================================================
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:c0d1b7001@smtp-brevo.com}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.localhost=${MAIL_SMTP_LOCALHOST:localhost}
spring.mail.properties.mail.smtp.from=${MAIL_FROM:solarsolutionstam@gmail.com}

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# =========================================================
# TAM SOLAR EMAIL SETTINGS
# =========================================================
tamsolar.mail.from=${MAIL_FROM:solarsolutionstam@gmail.com}

# =========================================================
# ADMIN SETTINGS
