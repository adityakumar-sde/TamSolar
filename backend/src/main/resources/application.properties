tamsolar.admin.email=${ADMIN_EMAIL:solarsolutionstam@gmail.com}
tamsolar.admin.token=${ADMIN_API_TOKEN:E3gA1TeAsAXRPGqefqxo9FZHEbV6wSDZ2NIV7pUouZU=}
tamsolar.admin.url=${ADMIN_PANEL_URL:https://tam-solar.vercel.app/admin.html}

# =========================================================
